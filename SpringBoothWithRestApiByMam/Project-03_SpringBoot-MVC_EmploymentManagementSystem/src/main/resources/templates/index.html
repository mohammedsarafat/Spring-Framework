<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Employee Management System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#4facfe,#00f2fe,#43e97b,#38f9d7);
    background-size:400% 400%;
    animation:gradientBG 12s ease infinite;
    overflow:hidden;
}

/* Animated Background */
@keyframes gradientBG{
    0%{
        background-position:0% 50%;
    }
    50%{
        background-position:100% 50%;
    }
    100%{
        background-position:0% 50%;
    }
}

/* Floating Circles */
body::before,
body::after{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    background:rgba(255,255,255,0.15);
    animation:float 8s ease-in-out infinite;
}

body::before{
    top:-80px;
    left:-80px;
}

body::after{
    bottom:-80px;
    right:-80px;
    animation-delay:4s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(30px);
    }
}

/* Card */
.container{
    background:rgba(255,255,255,0.18);
    backdrop-filter:blur(15px);
    padding:50px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
    text-align:center;
    animation:fadeIn 1.2s ease;
    width:420px;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(50px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h1{
    color:#fff;
    margin-bottom:35px;
    font-size:34px;
    text-shadow:2px 2px 10px rgba(0,0,0,.3);
}

.buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

a{
    text-decoration:none;
    padding:14px 28px;
    color:white;
    font-size:18px;
    font-weight:bold;
    border-radius:50px;
    transition:.4s;
    position:relative;
    overflow:hidden;
}

/* Add Button */
.add{
    background:#28a745;
}

/* View Button */
.view{
    background:#007bff;
}

a:hover{
    transform:translateY(-6px) scale(1.05);
    box-shadow:0 10px 25px rgba(0,0,0,.35);
}

a::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:rgba(255,255,255,.35);
    transform:skewX(-30deg);
    transition:.5s;
}

a:hover::before{
    left:120%;
}

.footer{
    margin-top:35px;
    color:white;
    font-size:15px;
    opacity:.9;
}
</style>

</head>

<body>

<div class="container">

    <h1>👨‍💼 Employee Management System</h1>

    <div class="buttons">

        <a class="add" th:href="@{/employee/add}">
            ➕ Add Employee
        </a>

        <a class="view" th:href="@{/employee/all}">
            📋 View Employees
        </a>

    </div>

    <div class="footer">
        Spring Boot • Thymeleaf • MVC
    </div>

</div>

</body>
</html>
