<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<title>Employee List</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    padding:40px;
    background:linear-gradient(-45deg,#4facfe,#00f2fe,#43e97b,#38f9d7);
    background-size:400% 400%;
    animation:gradient 12s ease infinite;
}

/* Animated Background */

@keyframes gradient{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* Title */

h2{
    text-align:center;
    color:white;
    margin-bottom:30px;
    font-size:38px;
    text-shadow:2px 2px 10px rgba(0,0,0,.3);
}

/* Table */

table{
    width:90%;
    margin:auto;
    border-collapse:collapse;
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(15px);
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
    animation:fadeIn 1s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

th{
    background:#0d6efd;
    color:white;
    padding:15px;
    font-size:18px;
}

td{
    padding:15px;
    text-align:center;
    color:#222;
    background:rgba(255,255,255,.75);
    transition:.3s;
}

tr:hover td{
    background:rgba(255,255,255,.95);
    transform:scale(1.01);
}

/* Buttons */

.action-btn{
    display:inline-block;
    text-decoration:none;
    color:white;
    padding:8px 18px;
    border-radius:30px;
    font-weight:bold;
    transition:.3s;
    margin:2px;
}

.edit{
    background:#28a745;
}

.delete{
    background:#dc3545;
}

.action-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 18px rgba(0,0,0,.3);
}

/* Bottom Buttons */

.bottom{
    margin-top:35px;
    text-align:center;
}

.bottom a{
    display:inline-block;
    text-decoration:none;
    color:white;
    background:#0d6efd;
    padding:12px 24px;
    border-radius:40px;
    font-size:17px;
    font-weight:bold;
    margin:10px;
    transition:.3s;
}

.bottom a:hover{
    background:#084298;
    transform:translateY(-4px);
    box-shadow:0 10px 20px rgba(0,0,0,.3);
}

</style>

</head>

<body>

<h2>👨‍💼 Employee List</h2>

<table>

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Department</th>
        <th>Email</th>
        <th>Mobile</th>
        <th>Action</th>
    </tr>

    <tr th:each="emp : ${employees}">

        <td th:text="${emp.id}"></td>

        <td th:text="${emp.name}"></td>

        <td th:text="${emp.dept}"></td>

        <td th:text="${emp.email}"></td>

        <td th:text="${emp.mob}"></td>

        <td>
            <a class="action-btn edit"
               th:href="@{/employee/edit/{id}(id=${emp.id})}">
                ✏ Edit
            </a>

            <a class="action-btn delete"
               th:href="@{/employee/delete/{id}(id=${emp.id})}"
               onclick="return confirm('Are you sure you want to delete this employee?')">
                🗑 Delete
            </a>
        </td>

    </tr>

</table>

<div class="bottom">

    <a th:href="@{/employee/add}">
        ➕ Add Employee
    </a>

    <a th:href="@{/}">
        🏠 Back to Home
    </a>

</div>

</body>
</html>
